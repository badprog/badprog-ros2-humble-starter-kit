# badprog.com
# #############################
# name
# #############################
name: Test Dockerfile

# #############################
# env
# #############################
env:
  BUILT_IMAGE_NAME: built-starter-kit-test
  EXPECTED_ROS_IMAGE: ros:humble-ros-base
  EXPECTED_USER: badprog
  ROS_SOURCE_STR: "source /opt/ros/humble/setup.bash"
  DOCKERFILE_PATH: .devcontainer/Dockerfile

# #############################
# on
# #############################
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# #############################
# jobs
# #############################
jobs:
  validate-image:
    runs-on: ubuntu-22.04
    steps:
      # ----------
      # Checkout
      # ----------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------
      # Build
      # ----------
      - name: Build Docker image
        run: docker build -t ${{ env.BUILT_IMAGE_NAME }} -f ${{ env.DOCKERFILE_PATH }} .

      # ----------
      # Test 1
      # ----------
      - name: Test 1 Check $FROM_IMAGE env
        run: |
          RESULT=$(docker run --rm ${{ env.BUILT_IMAGE_NAME }} printenv FROM_IMAGE)
          echo "Found: $RESULT"
          if [ "$RESULT" == "${{ env.EXPECTED_ROS_IMAGE }}" ]; then 
            echo "✅ Success"
            exit 0;
          else 
            echo "❌ Error"
            exit 1;
          fi

      # ----------
      # Test 2
      # ----------
      - name: Test 2 - Check user identity
        run: |
          RESULT=$(docker run --rm ${{ env.BUILT_IMAGE_NAME }} whoami)
          echo "User is: $RESULT" 
          [[ "$RESULT" == "${{ env.EXPECTED_USER }}" ]] && echo "✅ User OK"

      # ----------
      # Test 3
      # ----------
      - name: Test 3 - Check ROS sourcing
        run: |
          docker run --rm ${{ env.BUILT_IMAGE_NAME }} \
            grep -F "${{ env.ROS_SOURCE_STR }}" \
            /home/${{ env.EXPECTED_USER }}/.bashrc
