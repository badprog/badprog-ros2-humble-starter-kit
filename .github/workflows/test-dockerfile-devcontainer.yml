# badprog.com
# #############################
# name
# #############################
name: Test Dockerfile

# #############################
# env
# #############################
env:
  BUILT_IMAGE_NAME: built-starter-kit-test
  EXPECTED_ROS_IMAGE: ros:humble-ros-base
  EXPECTED_USER: badprog
  ROS_SOURCE_STR: "source /opt/ros/humble/setup.bash"
  DOCKERFILE_PATH: .devcontainer/Dockerfile

# #############################
# on
# #############################
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# #############################
# jobs
# #############################
# #############################
# job-dockerfile
# #############################
jobs:
  job-dockerfile:
    runs-on: ubuntu-22.04
    steps:
      # ----------
      # Checkout
      # ----------
      - name: Checkout code
        uses: actions/checkout@v5

      # ----------
      # Build
      # ----------
      - name: Build Docker image
        run: docker build -t ${{ env.BUILT_IMAGE_NAME }} -f ${{ env.DOCKERFILE_PATH }} .

      # ----------
      # Test 1
      # ----------
      - name: Test 1 Check $FROM_IMAGE env
        run: |
          RESULT=$(docker run --rm ${{ env.BUILT_IMAGE_NAME }} printenv FROM_IMAGE | tr -d '\r')
          echo "Found: [$RESULT]"
          if [ "$RESULT" == "${{ env.EXPECTED_ROS_IMAGE }}" ]; then 
            echo "✅ Success."
          else 
            echo "❌ Error: Expected ${{ env.EXPECTED_ROS_IMAGE }} but got [$RESULT]."
            exit 1
          fi

      # ----------
      # Test 2
      # ----------
      - name: Test 2 - Check user identity
        run: |
          RESULT=$(docker run --rm ${{ env.BUILT_IMAGE_NAME }} whoami | tr -d '\r')
          echo "User is: [$RESULT]" 
          if [ "$RESULT" == "${{ env.EXPECTED_USER }}" ]; then
            echo "✅ User OK."
          else
            echo "❌ Error: User is not ${{ env.EXPECTED_USER }}."
            exit 1
          fi

      # ----------
      # Test 3
      # ----------
      - name: Test 3 - Check ROS sourcing
        run: |
          echo "Checking for: ${{ env.ROS_SOURCE_STR }} in .bashrc."

          if docker run --rm ${{ env.BUILT_IMAGE_NAME }} grep -F "${{ env.ROS_SOURCE_STR }}" /home/${{ env.EXPECTED_USER }}/.bashrc; then
            echo "✅ Success: ROS sourcing is correctly configured."
          else
            echo "❌ Error: The line '${{ env.ROS_SOURCE_STR }}' was not found in .bashrc."
            exit 1
          fi

    # #############################
    # job-dockerfile
    # #############################
  job-devcontainer:
    runs-on: ubuntu-22.04
    steps:
      # ----------
      # Checkout
      # ----------
      - name: Checkout code
        uses: actions/checkout@v5

      # ----------
      # Install DevContainer CLI for the tests
      # ----------
      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      # ----------
      # Build and make it alive
      # ----------
      - name: Build and Up Dev Container
        run: |
          devcontainer up --workspace-folder .

      # ----------
      # Test 1
      # ----------
      - name: Test 1 - Check Workspace Folder
        run: |
          RESULT=$(devcontainer exec --workspace-folder . pwd)
          echo "Workspace is: [$RESULT]"
          if [ "$RESULT" == "/workspaces" ]; then
              echo "✅ Workspace OK."
          else
              echo "❌ Error: Expected /workspaces but got [$RESULT]."
              exit 1
          fi

      # ----------
      # Test 2
      # ----------
      - name: Test 2 - Check Remote User
        run: |
          RESULT=$(devcontainer exec --workspace-folder . whoami)
          echo "Remote user is: [$RESULT]"
          if [ "$RESULT" == "badprog" ]; then
              echo "✅ User OK."
          else
              echo "❌ Error: Expected badprog but got [$RESULT]."
              exit 1
          fi
